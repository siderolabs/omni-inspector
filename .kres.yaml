---
kind: common.GHWorkflow
spec:
  customRunners:
    - self-hosted
    - omni
---
kind: js.Protobuf
spec:
  baseSpecPath: /api
  destinationRoot: src/api
  specs:
    - source: https://raw.githubusercontent.com/googleapis/googleapis/master/google/rpc/status.proto
      subdirectory: google/rpc/
      genGateway: true
    - source: https://raw.githubusercontent.com/cosi-project/specification/5c734257bfa6a3acb01417809797dbfbe0e73c71/proto/v1alpha1/resource.proto
      subdirectory: v1alpha1
      genGateway: true
    - source: https://raw.githubusercontent.com/siderolabs/omni/aa6acff6329662124d925716b2d49885995acace/client/api/common/omni.proto
      subdirectory: common
      genGateway: true
    - source: https://raw.githubusercontent.com/siderolabs/omni/aa6acff6329662124d925716b2d49885995acace/client/api/omni/resources/resources.proto
      subdirectory: resources
      genGateway: true
---
kind: common.Image
name: image-omni-inspector
spec:
  extraEnvironment:
    PLATFORM: linux/amd64,linux/arm64
---
kind: golang.Build
spec:
  outputs:
    linux-amd64:
      GOOS: linux
      GOARCH: amd64
    linux-arm64:
      GOOS: linux
      GOARCH: arm64
---
kind: service.CodeCov
spec:
  enabled: false
